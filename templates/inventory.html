{% extends "base.html" %}
{% block title %}Inventory{% endblock %}
{% block content %}
<div class="card">
  <h2>Add vaccine</h2>
  <form method="post" class="row">
    <div><label>Vaccine name</label><input name="name" required></div>
    <div><label>Doses in stock</label><input type="number" name="stock" min="0" value="0" required></div>
    <button>Add to inventory</button>
  </form>
</div>
<div class="card">
  <h2>Inventory</h2>
  <table>
    <tr><th>Vaccine</th><th>Doses</th><th>Restock</th><th></th></tr>
    {% for v in vaccines %}
    <tr><td>{{ v.name }}</td>
      <td class="{{ 'low' if v.stock <= 10 }}">{{ v.stock }}</td>
      <td><form class="inline" method="post" action="{{ url_for('restock', vid=v.id) }}">
        <input type="number" name="qty" min="1" value="10" style="width:80px"> <button class="ghost">Add</button></form></td>
      <td><form class="inline" method="post" action="{{ url_for('delete_vaccine', vid=v.id) }}" onsubmit="return confirm('Delete this vaccine?')"><button class="danger">Delete</button></form></td>
    </tr>
    {% else %}<tr><td colspan="4" class="muted">No vaccines yet.</td></tr>{% endfor %}
  </table>
</div>
{% endblock %}
